name: Reference pose observations
on:
  push:
    branches: ['study/munoz-motion-2103167579959251281']
    paths: ['.github/workflows/munoz-reference-pose-observations.yml']
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare native and Python observation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2
          python -m pip install -q mediapipe opencv-python-headless numpy pyyaml
      - name: Run the reviewed source-observation implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import urllib.request, yaml
          url='https://raw.githubusercontent.com/usking08/YHWH-knowledge-tree/c6581b3bf3c69c8479feb9b4897b0dbb7da817c7/.github/workflows/munoz-reference-pose-observations.yml'
          with urllib.request.urlopen(url, timeout=30) as response:
              workflow=yaml.safe_load(response.read())
          script=workflow['jobs']['observe']['steps'][1]['run']
          exec(compile(script, 'reviewed_reference_observation.py', 'exec'))
      - name: Preserve candidate observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: munoz-reference-observations
          path: observations/
          retention-days: 1
          if-no-files-found: error
